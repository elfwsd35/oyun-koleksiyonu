<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oyun Koleksiyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --beyaz: #ffffff;
            --soluk: rgba(255, 255, 255, .6);
            --cam: rgba(255, 255, 255, .06);
            --cam-kenar: rgba(255, 255, 255, .12);
            --mavi: #0070d1;
            --kirmizi: #ff5a5f;
            --sari: #ffd166;
        }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
            color: var(--beyaz);
            display: flex; flex-direction: column;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(0, 112, 209, .35), transparent 55%),
                radial-gradient(ellipse at 90% 100%, rgba(70, 40, 160, .35), transparent 50%),
                linear-gradient(180deg, #020818 0%, #050d24 100%);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Ust menu */
        nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 56px 0; }
        .sekmeler { display: flex; gap: 32px; }
        .sekme { background: none; border: none; color: var(--soluk); font: inherit; font-size: 18px; font-weight: 500; cursor: pointer; padding-bottom: 6px; border-bottom: 2px solid transparent; transition: .2s; }
        .sekme:hover { color: var(--beyaz); }
        .sekme.aktif { color: var(--beyaz); border-bottom-color: var(--beyaz); }
        .sag { display: flex; align-items: center; gap: 24px; color: var(--soluk); font-size: 14px; }
        .saat { color: var(--beyaz); font-size: 18px; }

        /* Secili oyunun buyuk basligi */
        .vitrin { padding: 28px 56px 0; }
        .vitrin h1 { font-size: 36px; font-weight: 700; letter-spacing: -1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vitrin p { color: var(--soluk); font-size: 15px; margin-top: 6px; display: flex; align-items: center; gap: 8px; }

        /* Oyun kartlari (orta alan, bos alani doldurur) */
        .seri { flex: 1; display: flex; align-items: center; gap: 22px; padding: 0 56px; overflow-x: auto; scrollbar-width: none; }
        .seri::-webkit-scrollbar { display: none; }
        .kart {
            position: relative; flex: 0 0 180px; height: 240px; border-radius: 14px; padding: 18px;
            display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
            cursor: pointer; transition: transform .25s ease, box-shadow .25s ease;
            outline: 3px solid transparent; outline-offset: 4px;
        }
        .kart:hover, .kart.secili { transform: scale(1.06); outline-color: var(--beyaz); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
        .kart .arka { position: absolute; right: -24px; bottom: 30px; opacity: .12; pointer-events: none; }
        .kart .baslik {
            position: relative; font-size: 22px; font-weight: 800; line-height: 1.1; letter-spacing: -.5px;
            padding-right: 28px; text-transform: uppercase;
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
        }
        .kart .alt { position: relative; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; }
        .kart .puan { display: flex; align-items: center; gap: 4px; color: var(--sari); }
        .rozet { background: rgba(0, 0, 0, .35); padding: 4px 10px; border-radius: 999px; font-size: 12px; }
        .kart .sil {
            position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; z-index: 2;
            border: none; background: rgba(0, 0, 0, .45); color: var(--beyaz); cursor: pointer;
            display: grid; place-items: center; opacity: 0; transition: .2s;
        }
        .kart:hover .sil { opacity: 1; }
        .kart .sil:hover { background: var(--kirmizi); }
        .bos { color: var(--soluk); font-size: 16px; }

        /* Oyun ekleme paneli (tek satir) */
        .panel {
            margin: 0 56px 32px; padding: 20px 24px; border-radius: 18px;
            background: var(--cam); border: 1px solid var(--cam-kenar); backdrop-filter: blur(20px);
        }
        .panel h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .form { display: grid; grid-template-columns: 2fr 1fr .7fr auto auto; gap: 14px; align-items: end; }
        .alan label { display: block; font-size: 12px; color: var(--soluk); margin-bottom: 6px; }
        input[type=text], input[type=number], select {
            width: 100%; padding: 12px 14px; font: inherit; font-size: 14px;
            background: rgba(0, 0, 0, .3); color: var(--beyaz);
            border: 1px solid var(--cam-kenar); border-radius: 10px; outline: none; transition: .2s;
        }
        select option { background: #0b1530; }
        input:focus, select:focus { border-color: var(--beyaz); }
        .onay { display: flex; align-items: center; gap: 8px; color: var(--soluk); font-size: 14px; cursor: pointer; height: 45px; white-space: nowrap; }
        .onay input { width: 17px; height: 17px; accent-color: var(--mavi); }
        .btn {
            height: 45px; padding: 0 28px; border: none; border-radius: 999px;
            background: var(--beyaz); color: #000; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: .2s;
        }
        .btn:hover { transform: scale(1.04); box-shadow: 0 0 0 4px rgba(255, 255, 255, .25); }
        .mesaj { color: var(--kirmizi); font-size: 13px; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
        .mesaj:empty { display: none; }
    </style>
</head>
<body>

<nav>
    <div class="sekmeler">
        <button class="sekme aktif" id="sekmeTumu" onclick="filtrele(false)">Koleksiyon</button>
        <button class="sekme" id="sekmeBitti" onclick="filtrele(true)">Bitirdiklerim</button>
    </div>
    <div class="sag">
        <span id="ozet"></span>
        <span class="saat" id="saat"></span>
    </div>
</nav>

<!-- Secili oyunun buyuk basligi -->
<section class="vitrin">
    <h1 id="vitrinAd">Oyun Koleksiyonu</h1>
    <p id="vitrinBilgi">Bir oyunun üzerine gel</p>
</section>

<!-- Oyun kartlari -->
<section class="seri" id="seri"></section>

<!-- Oyun ekleme paneli -->
<section class="panel">
    <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Yeni Oyun Ekle
    </h2>
    <div class="form">
        <div class="alan">
            <label for="ad">Oyunun adı</label>
            <input id="ad" type="text" placeholder="Örn. Ghost of Yotei">
        </div>
        <div class="alan">
            <label for="platform">Platform</label>
            <select id="platform">
                <option>PS5</option><option>PC</option><option>Xbox</option>
                <option>Nintendo Switch</option><option>Mobil</option>
            </select>
        </div>
        <div class="alan">
            <label for="puan">Puan (1-10)</label>
            <input id="puan" type="number" min="1" max="10" placeholder="8">
        </div>
        <label class="onay"><input id="bitirildi" type="checkbox"> Bitirdim</label>
        <button class="btn" onclick="oyunEkle()">Kaydet</button>
    </div>
    <p class="mesaj" id="mesaj"></p>
</section>

<script>
    // Ikonlar
    const ikonYildiz = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    const ikonTik = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const ikonSaat = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    const ikonCop = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
    const ikonUyari = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    const ikonKol = '<svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59l-.6 6A4 4 0 0 0 6.08 19c1.1 0 2.13-.6 2.67-1.56L10 15h4l1.25 2.44A3.02 3.02 0 0 0 17.92 19a4 4 0 0 0 3.98-4.41l-.6-6A4 4 0 0 0 17.32 5z"/></svg>';

    // Kart renkleri (oyun adina gore sabit bir renk secilir)
    const renkler = [
        ["#0070d1", "#00306e"], ["#6d28d9", "#2a1360"], ["#0891b2", "#0b3a4d"],
        ["#be123c", "#3d0414"], ["#c2410c", "#3a1205"], ["#15803d", "#062814"]
    ];
    function renkSec(ad) {
        let toplam = 0;
        for (const harf of ad) toplam += harf.charCodeAt(0);
        const [a, b] = renkler[toplam % renkler.length];
        return `linear-gradient(160deg, ${a}, ${b})`;
    }

    // Kullanicinin yazdigi metni guvenli hale getirir
    function temizle(metin) {
        const div = document.createElement("div");
        div.textContent = metin;
        return div.innerHTML;
    }

    // Sag ustteki saat
    function saatGuncelle() {
        document.getElementById("saat").innerText =
            new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    }
    saatGuncelle();
    setInterval(saatGuncelle, 10000);

    let sadeceBitenler = false;
    let oyunlar = [];

    // Bir kartin uzerine gelinince ustteki buyuk basligi gunceller
    function vitrineKoy(o) {
        document.getElementById("vitrinAd").innerText = o.ad;
        document.getElementById("vitrinBilgi").innerHTML =
            temizle(o.platform) + " &nbsp;·&nbsp; " + ikonYildiz + " " + o.puan + "/10 &nbsp;·&nbsp; " +
            (o.bitirildi ? ikonTik + " Bitirildi" : ikonSaat + " Devam ediyor");
    }

    // Verileri sunucudan (GET) okuyup kartlari olusturur
    async function listele() {
        const adres = sadeceBitenler ? "/api/oyunlar/bitirilenler" : "/api/oyunlar";
        oyunlar = await (await fetch(adres)).json();

        const tumu = await (await fetch("/api/oyunlar")).json();
        document.getElementById("ozet").innerText =
            tumu.length + " oyun · " + tumu.filter(o => o.bitirildi).length + " bitirildi";

        const seri = document.getElementById("seri");
        if (oyunlar.length === 0) {
            seri.innerHTML = '<p class="bos">Burada henüz oyun yok.</p>';
            document.getElementById("vitrinAd").innerText = "Oyun Koleksiyonu";
            document.getElementById("vitrinBilgi").innerText = "Aşağıdan ilk oyununu ekle";
            return;
        }
        seri.innerHTML = oyunlar.map((o, i) => `
            <div class="kart ${i === 0 ? "secili" : ""}" style="background:${renkSec(o.ad)}"
                 onmouseenter="seciliYap(this, ${i})">
                <div class="arka">${ikonKol}</div>
                <button class="sil" title="Sil" onclick="event.stopPropagation(); oyunSil(${o.id})">${ikonCop}</button>
                <div class="baslik" lang="en">${temizle(o.ad)}</div>
                <div class="alt">
                    <span class="rozet">${temizle(o.platform)}</span>
                    <span class="puan">${ikonYildiz} ${o.puan}</span>
                </div>
            </div>`).join("");
        vitrineKoy(oyunlar[0]);
    }

    function seciliYap(kart, i) {
        document.querySelectorAll(".kart").forEach(k => k.classList.remove("secili"));
        kart.classList.add("secili");
        vitrineKoy(oyunlar[i]);
    }

    // Ust menudeki sekmeler
    function filtrele(bitenler) {
        sadeceBitenler = bitenler;
        document.getElementById("sekmeTumu").classList.toggle("aktif", !bitenler);
        document.getElementById("sekmeBitti").classList.toggle("aktif", bitenler);
        listele();
    }

    // Formdaki bilgileri sunucuya (POST) gonderip kaydeder
    async function oyunEkle() {
        const oyun = {
            ad: document.getElementById("ad").value,
            platform: document.getElementById("platform").value,
            puan: Number(document.getElementById("puan").value),
            bitirildi: document.getElementById("bitirildi").checked
        };
        const cevap = await fetch("/api/oyunlar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(oyun)
        });
        const mesaj = document.getElementById("mesaj");
        // Kural ihlali varsa (400) sunucunun hata mesajini goster
        mesaj.innerHTML = cevap.ok ? "" : ikonUyari + temizle(await cevap.text());
        if (cevap.ok) {
            document.getElementById("ad").value = "";
            document.getElementById("puan").value = "";
            document.getElementById("bitirildi").checked = false;
        }
        listele();
    }

    // Oyunu sunucudan (DELETE) siler
    async function oyunSil(id) {
        await fetch("/api/oyunlar/" + id, { method: "DELETE" });
        listele();
    }

    listele();
</script>
</body>
</html>
